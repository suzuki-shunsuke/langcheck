---
name: integration test
on:
  workflow_call:
jobs:
  integration-test:
    # Go modules are downloaded by the gomodule job in the caller workflow
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10

      - run: |
          go install -ldflags "-X main.version=v1.0.0 -X main.commit=$GITHUB_SHA -X main.date=$(date +"%Y-%m-%dT%H:%M:%SZ%:z" | tr -d '+')" ./cmd/langcheck
      - run: langcheck -v
      - run: langcheck check LICENSE
      - run: |
          if langcheck check test.md; then
            echo "::error:: langcheck check test.md succeeded unexpectedly"
            exit 1
          else
            echo "[OK] langcheck check test.md failed as expected"
          fi
